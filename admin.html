<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Code Hub Namibia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f14;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .login-box {
      max-width: 420px;
      margin: 100px auto;
      background: #121820;
      border: 1px solid #26313c;
      border-radius: 14px;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
      color: #00e5ff;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #36424e;
      background: #0b0f14;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #00e5ff;
      color: #001014;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      color: #ff6b6b;
      margin-top: 15px;
    }

    #dashboard {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .logout {
      width: auto;
      padding: 10px 18px;
      background: #26313c;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #121820;
      border: 1px solid #26313c;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-title {
      color: #8d98a3;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
      color: #00e5ff;
    }

    .table-wrap {
      overflow-x: auto;
      background: #121820;
      border: 1px solid #26313c;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #26313c;
      white-space: nowrap;
    }

    th {
      color: #00e5ff;
      font-size: 13px;
    }

    td {
      color: #d8dee4;
      font-size: 14px;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      background: #26313c;
      font-size: 12px;
    }

    .refresh {
      width: auto;
      padding: 10px 18px;
      margin-bottom: 15px;
    }

    .loading {
      color: #8d98a3;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .logout,
      .refresh {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="login" class="login-box">
    <h1>CODE HUB NAMIBIA</h1>

    <p>Admin Dashboard</p>

    <input
      type="password"
      id="password"
      placeholder="Admin password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <div id="loginError" class="error"></div>
  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="container">

    <div class="topbar">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Code Hub Namibia orders</p>
      </div>

      <button class="logout" onclick="logout()">
        LOG OUT
      </button>
    </div>


    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          TOTAL ORDERS
        </div>

        <div id="totalOrders" class="stat-value">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          AWAITING PAYMENT
        </div>

        <div id="awaitingPayment" class="stat-value">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          TOTAL SALES
        </div>

        <div id="totalSales" class="stat-value">
          N$0
        </div>
      </div>

    </div>


    <button class="refresh" onclick="loadOrders()">
      REFRESH ORDERS
    </button>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Order</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Email</th>
            <th>Payment</th>
            <th>Voucher</th>
            <th>Date</th>
          </tr>

        </thead>

        <tbody id="orders">

          <tr>
            <td colspan="8" class="loading">
              Loading orders...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>


  <script>

    let adminPassword = "";


    function login() {

      const password =
        document.getElementById("password").value.trim();

      if (!password) {

        document.getElementById("loginError").textContent =
          "Enter your admin password.";

        return;
      }

      adminPassword = password;

      document.getElementById("login").style.display =
        "none";

      document.getElementById("dashboard").style.display =
        "block";

      loadOrders();
    }


    async function loadOrders() {

      const ordersElement =
        document.getElementById("orders");

      ordersElement.innerHTML =
        '<tr><td colspan="8" class="loading">Loading orders...</td></tr>';

      try {

        const response = await fetch(
          "/api/admin-orders",
          {
            method: "GET",
            headers: {
              "Authorization":
                `Bearer ${adminPassword}`
            }
          }
        );


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message || "Unable to load orders"
          );
        }


        const orders =
          data.orders || [];


        document.getElementById("totalOrders").textContent =
          orders.length;


        const awaiting =
          orders.filter(
            order =>
              order.payment_status ===
              "awaiting_payment"
          ).length;


        document.getElementById("awaitingPayment").textContent =
          awaiting;


        const sales =
          orders.reduce(
            (sum, order) =>
              sum + Number(order.total || 0),
            0
          );


        document.getElementById("totalSales").textContent =
          "N$" + sales.toLocaleString();


        if (orders.length === 0) {

          ordersElement.innerHTML =
            '<tr><td colspan="8" class="loading">No orders yet.</td></tr>';

          return;
        }


        ordersElement.innerHTML =
          orders.map(order => {

            const date =
              order.created_at
                ? new Date(order.created_at)
                    .toLocaleString()
                : "-";


            return `
              <tr>

                <td>
                  <strong>
                    ${escapeHtml(order.order_number || "-")}
                  </strong>
                </td>

                <td>
                  ${escapeHtml(order.product || "-")}
                </td>

                <td>
                  ${escapeHtml(String(order.quantity || 0))}
                </td>

                <td>
                  N$${Number(order.total || 0).toLocaleString()}
                </td>

                <td>
                  ${escapeHtml(order.email || "-")}
                </td>

                <td>
                  <span class="status">
                    ${escapeHtml(order.payment_status || "-")}
                  </span>
                </td>

                <td>
                  <span class="status">
                    ${escapeHtml(order.voucher_status || "-")}
                  </span>
                </td>

                <td>
                  ${escapeHtml(date)}
                </td>

              </tr>
            `;

          }).join("");


      } catch (error) {

        console.error(error);

        ordersElement.innerHTML =
          `<tr>
            <td colspan="8" class="loading">
              ${escapeHtml(error.message)}
            </td>
          </tr>`;

      }

    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function logout() {

      adminPassword = "";

      document.getElementById("password").value =
        "";

      document.getElementById("dashboard").style.display =
        "none";

      document.getElementById("login").style.display =
        "block";

    }


    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            login();
          }

        }
      );

  </script>

</body>
</html>
