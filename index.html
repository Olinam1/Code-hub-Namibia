<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Hub Namibia</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #15151d;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #aaa;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px;
    }

    .hero {
      text-align: center;
      padding: 40px 10px;
    }

    .hero h2 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #bbb;
      font-size: 18px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #171720;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    .product h3 {
      margin-top: 0;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      background: #ffffff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>CODE HUB NAMIBIA</h1>
  <p>Digital Gaming Store</p>
</header>

<div class="container">

  <section class="hero">
    <h2>Game. Buy. Play.</h2>
    <p>Digital gaming vouchers delivered electronically.</p>
  </section>

  <section class="products">

    <div class="product">
      <h3>PlayStation Network</h3>
      <p>South Africa</p>
      <div class="price">R500</div>
      <button>Buy Now</button>
    </div>

    <div class="product">
      <h3>PlayStation Network</h3>
      <p>South Africa</p>
      <div class="price">R750</div>
      <button>Buy Now</button>
    </div>

    <div class="product">
      <h3>PlayStation Network</h3>
      <p>South Africa</p>
      <div class="price">R1,000</div>
      <button>Buy Now</button>
    </div>

    <div class="product">
      <h3>PlayStation Network</h3>
      <p>South Africa</p>
      <div class="price">R2,000</div>
      <button>Buy Now</button>
    </div>

  </section>

</div>

<footer>
  © 2026 Code Hub Namibia
</footer>

</body>
</html>
